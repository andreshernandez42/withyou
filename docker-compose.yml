services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-withyou}
      POSTGRES_USER: ${POSTGRES_USER:-withyou}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-withyou_demo_2026}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-withyou} -d ${POSTGRES_DB:-withyou}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api1:
    build: ./backend
    env_file: .env.demo
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-withyou}:${POSTGRES_PASSWORD:-withyou_demo_2026}@db:5432/${POSTGRES_DB:-withyou}
      REDIS_URL: redis://redis:6379/0
      CELERY_ENABLED: "true"
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped

  api2:
    build: ./backend
    env_file: .env.demo
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-withyou}:${POSTGRES_PASSWORD:-withyou_demo_2026}@db:5432/${POSTGRES_DB:-withyou}
      REDIS_URL: redis://redis:6379/0
      CELERY_ENABLED: "true"
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped

  worker:
    build: ./backend
    command: ["celery", "-A", "app.workers.celery_app.celery_app", "worker", "--loglevel=INFO"]
    env_file: .env.demo
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-withyou}:${POSTGRES_PASSWORD:-withyou_demo_2026}@db:5432/${POSTGRES_DB:-withyou}
      REDIS_URL: redis://redis:6379/0
      CELERY_ENABLED: "true"
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped

  beat:
    build: ./backend
    command: ["celery", "-A", "app.workers.celery_app.celery_app", "beat", "--loglevel=INFO"]
    env_file: .env.demo
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-withyou}:${POSTGRES_PASSWORD:-withyou_demo_2026}@db:5432/${POSTGRES_DB:-withyou}
      REDIS_URL: redis://redis:6379/0
      CELERY_ENABLED: "true"
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
